<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220" id="theme-color-meta">
<meta name="color-scheme" content="dark light">
<meta name="description" content="面向 Vue + TypeScript 工程师的 Java 后端学习 App：10 模块 39 课，先写后端再补原理。">
<meta name="mobile-web-app-capable" content="yes">
<title>Java 后端学习 · 从 Vue 出发</title>
<link rel="icon" type="image/png" href="./assets/img/logo.png">
<script>
  /* 主题预置：在首屏绘制前就把 data-theme 定下来，避免浅色用户先闪一下深色。
     取值与 src/stores/theme.ts 共用同一个 localStorage key。 */
  (function () {
    try {
      var pref = localStorage.getItem('jla.theme.v1') || 'system';
      var dark = pref === 'dark' ||
        (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      var scheme = document.querySelector('meta[name="color-scheme"]');
      if (scheme) scheme.setAttribute('content', dark ? 'dark light' : 'light dark');
      var tc = document.getElementById('theme-color-meta');
      if (tc) tc.setAttribute('content', dark ? '#0B1220' : '#F3F6FC');
    } catch (e) { /* 隐私模式下 localStorage 可能抛异常，保持默认深色即可 */ }
  })();
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
